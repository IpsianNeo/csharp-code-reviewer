# tools/mcp_manifest.yml
version: "1.0"
description: >
  MCP manifest for production-ready AI-driven C# code reviewer.
  Each tool entry may set `shell` (powershell, bash) or use a shell command as `command`.
  `args` supports parameter placeholders like {baseRef}, {headRef}, {filePath}, {outputPath}, {content}.

tools:
  git_diff:
    description: "Generate the diff between base and head branches (local or remote-aware)."
    # shell indicates how to run the args (powershell on Windows, pwsh/powershell core on Linux if installed)
    shell: powershell
    # args will be passed to the shell process; manifest uses repo-root relative script path
    args: "-ExecutionPolicy Bypass -File \"tools/git_diff.ps1\" {baseRef} {headRef}"
    output: text
    timeout_seconds: 60

  fetch_file:
    description: "Fetch the full content of a file at a given commit or branch."
    shell: powershell
    args: "-ExecutionPolicy Bypass -File \"tools/fetch_file.ps1\" {commitRef} {filePath}"
    output: text
    timeout_seconds: 30

  git_comment:
    description: "Save AI review output to a file or push into PR (extensible)."
    shell: powershell
    args: "-ExecutionPolicy Bypass -File \"tools/git_comment.ps1\" \"{outputPath}\" \"{content}\""
    output: none
    timeout_seconds: 20
